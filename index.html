<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>بطاقة طوارئ · أثَر</title>
<!--
  بطاقة الطوارئ — صفحة ثابتة بلا خادم.
  البيانات كلها بعد «#» في الرابط (رمز QR في تطبيق أثَر)، والجزء بعد «#» لا يُرسَل
  إلى أي خادم: المتصفح يفكّه هنا ويرسم البطاقة. هذه الصفحة لا تحمل بيانات أحد،
  ولا تتصل بأي عنوان (انظر سياسة المحتوى أعلاه: default-src 'none').
  الصيغة في shared/emergencyLink.ts بمستودع أثَر.
-->
<style>
:root{color-scheme:light dark;--bg:#F6F4F1;--card:#FFFFFF;--ink:#16130F;--ink2:#5A524A;--line:#E2DCD4;
  --red:#B3261E;--red-wash:#FBE9E7;--banner:#B3261E;--amber:#8A5A00;--amber-wash:#FFF3D6;--green:#11624B}
@media (prefers-color-scheme:dark){:root{--bg:#120E0D;--card:#1C1716;--ink:#F3ECE8;--ink2:#B4A69F;--line:#3A302C;
  --red:#FF6B5E;--red-wash:#3A1714;--amber:#F2B13B;--amber-wash:#33270E;--green:#3BA983}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);direction:rtl;
  font:16px/1.5 "IBM Plex Sans Arabic","Noto Kufi Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
.top{background:var(--banner);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
.top b{font-size:17px}.top small{opacity:.85;display:block;font-size:12px;letter-spacing:.08em}
.name{font-size:26px;font-weight:700;margin:14px 0 2px}
.sub{color:var(--ink2);font-size:14px}
.k{font-size:11.5px;color:var(--ink2);font-weight:600;letter-spacing:.02em;display:flex;gap:6px;align-items:baseline}
.k i{font-style:normal;font-size:10px;letter-spacing:.12em;opacity:.8;direction:ltr}
.box{background:var(--card);border:1px solid var(--line);padding:12px 14px;margin-top:10px}
.danger{background:var(--red-wash);border-color:var(--red)}
.danger .v{color:var(--red);font-weight:700;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.big{font:700 28px/1.1 "SF Mono",Consolas,monospace;direction:ltr;text-align:right;margin-top:4px}
.none{color:var(--ink2);font-size:14px}
ul{margin:6px 0 0;padding:0;list-style:none}
li{padding:7px 0;border-top:1px solid var(--line)}li:first-child{border-top:0}
.med b{font-size:15.5px}.med .d{color:var(--ink2);font-size:13px}
.flag{display:inline-block;background:var(--amber-wash);color:var(--amber);border:1px solid var(--amber);
  font-size:12px;font-weight:700;padding:1px 7px;margin-inline-start:6px}
.calls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.call{display:block;text-align:center;text-decoration:none;padding:14px 8px;font-weight:700;font-size:16px}
.call small{display:block;font-weight:500;font-size:12.5px;opacity:.9}
.c997{background:var(--banner);color:#fff}.cice{background:var(--card);color:var(--ink);border:1px solid var(--ink2)}
.foot{margin-top:22px;color:var(--ink2);font-size:12px;border-top:1px solid var(--line);padding-top:10px}
.center{min-height:70vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:8px}
@media print{.calls{display:none}body{background:#fff;color:#000}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="center"><p class="sub">جارٍ فتح بطاقة الطوارئ…</p></div></div>
<noscript><div class="wrap"><div class="center"><b>تحتاج هذه البطاقة تفعيل JavaScript في المتصفح.</b></div></div></noscript>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var esc = function (s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); };
  var ltr = function (s) { return '<bdi dir="ltr">' + esc(s) + '</bdi>'; };
  var K = function (ar, en) { return '<div class="k">' + ar + ' <i>' + en + '</i></div>'; };

  // الأدوية الحرجة — القوائم نفسها في الخادم (server/src/entries/alerts.ts)
  var CRITICAL = [
    [/وارفارين|marevan|coumadin|warfarin|ايليكويس|eliquis|apixaban|زاريلتو|xarelto|rivaroxaban|pradaxa|dabigatran|enoxaparin|clexane|كليكسان|edoxaban|lixiana|heparin|هيبارين/i, 'مضاد تخثّر', 'Anticoagulant'],
    [/بلافيكس|plavix|clopidogrel|كلوبيدوجريل|brilinta|ticagrelor|prasugrel/i, 'مضاد صفائح', 'Antiplatelet'],
    [/انسولين|إنسولين|insulin|lantus|لانتوس|novorapid|نوفورابيد|humalog|toujeo|tresiba|mixtard|اماريل|amaryl|glimepiride|جليميبيريد|gliclazide|diamicron|دياميكرون|glibenclamide/i, 'خطر نقص سكر الدم', 'Hypoglycemia risk'],
    [/نيتروجليسرين|nitroglycerin|glyceryl trinitrate|isosorbide|ايزوسوربيد|imdur|ايمدور/i, 'نترات', 'Nitrate'],
  ];
  var flags = function (name) { return CRITICAL.filter(function (c) { return c[0].test(name); }); };

  function fail(title, sub) {
    app.innerHTML = '<div class="center"><b style="font-size:20px">' + esc(title) + '</b><p class="sub">' + esc(sub) + '</p>' +
      '<a class="call c997" style="min-width:220px" href="tel:997">اتصل بالإسعاف<small>997</small></a></div>';
  }

  function b64urlToBytes(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function inflate(bytes) {
    var ds = new DecompressionStream('deflate-raw');
    return new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer()
      .then(function (buf) { return new TextDecoder().decode(buf); });
  }

  function render(a) {
    var d = {
      name: a[1] || '', age: a[2], sex: a[3] || '', blood: a[4], weight: a[5],
      allergies: a[6] || [], recorded: a[7] === 1, conditions: a[8] || [], meds: a[9] || [],
      notes: a[10], contact: a[11], issued: a[12] || ''
    };
    var severe = d.allergies.filter(function (x) { return x[1] === 'شديدة'; });
    var h = '';
    h += '<div class="top"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3.6v5c0 5-3.4 8.3-8 9.4-4.6-1.1-8-4.4-8-9.4v-5z" fill="none" stroke="#fff" stroke-width="1.8"/><path d="M12 9v5M9.5 11.5h5" stroke="#fff" stroke-width="2"/></svg>' +
      '<div><b>بطاقة طوارئ</b><small>EMERGENCY MEDICAL CARD</small></div></div>';
    h += '<div class="name">' + esc(d.name || 'بلا اسم مسجّل') + '</div>';
    var sub = [d.age != null ? d.age + ' سنة' : '', d.sex].filter(Boolean).join(' · ');
    if (sub) h += '<div class="sub">' + esc(sub) + '</div>';

    // الحساسية أولاً: دواء خاطئ في الدقيقة الأولى
    h += '<div class="box' + (severe.length ? ' danger' : '') + '">' + K('حساسية', 'ALLERGIES');
    if (d.allergies.length) {
      h += '<ul>' + d.allergies.map(function (x) {
        return '<li><span class="' + (x[1] === 'شديدة' ? 'v' : '') + '">' + esc(x[0]) + '</span>' +
          ' <span class="sub">· ' + esc(x[1]) + (x[2] ? ' · ' + esc(x[2]) : '') + '</span></li>';
      }).join('') + '</ul>';
    } else {
      h += '<div class="none">' + (d.recorded ? 'لا حساسية معروفة · No known allergies' : 'غير مسجّلة · Not recorded') + '</div>';
    }
    h += '</div>';

    var anyFlag = d.meds.some(function (m) { return flags(m[0]).length; });
    h += '<div class="box' + (anyFlag ? ' danger' : '') + '">' + K('الأدوية الحالية', 'MEDICATIONS');
    h += d.meds.length ? '<ul>' + d.meds.map(function (m) {
      return '<li class="med"><b>' + ltr(m[0]) + '</b>' + flags(m[0]).map(function (f) { return '<span class="flag">' + f[1] + ' · ' + f[2] + '</span>'; }).join('') +
        (m[1] ? '<div class="d">' + esc(m[1]) + '</div>' : '') + '</li>';
    }).join('') + '</ul>' : '<div class="none">لا أدوية مسجّلة</div>';
    h += '</div>';

    h += '<div class="box grid">' +
      '<div>' + K('الفصيلة', 'BLOOD') + '<div class="big">' + esc(d.blood || '—') + '</div></div>' +
      '<div>' + K('العمر', 'AGE') + '<div class="big">' + esc(d.age != null ? d.age : '—') + '</div></div>' +
      '<div>' + K('الوزن', 'KG') + '<div class="big">' + esc(d.weight != null ? d.weight : '—') + '</div></div></div>';

    if (d.notes) h += '<div class="box danger">' + K('ملاحظات طبية مهمّة', 'CRITICAL NOTES') + '<div class="v" style="font-size:16px">' + esc(d.notes) + '</div></div>';

    h += '<div class="box">' + K('أمراض مزمنة', 'CONDITIONS') +
      (d.conditions.length ? '<ul>' + d.conditions.map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ul>' : '<div class="none">لا شيء مسجّل</div>') + '</div>';

    h += '<div class="calls"><a class="call c997" href="tel:997">اتصل بالإسعاف<small>997</small></a>';
    if (d.contact && d.contact[2]) {
      h += '<a class="call cice" href="tel:' + esc(String(d.contact[2]).replace(/[^\d+]/g, '')) + '">اتصل بـ' + esc(d.contact[0]) +
        '<small>' + esc(d.contact[1] || 'جهة الطوارئ') + ' · ' + ltr(d.contact[2]) + '</small></a>';
    }
    h += '</div>';

    h += '<div class="foot">بيانات أدخلها المريض بنفسه في تطبيق «أثَر»، تحقّق سريرياً.' +
      (d.issued ? ' آخر تحديث للرمز: ' + ltr(d.issued) + '.' : '') +
      '<div dir="ltr" style="text-align:left;margin-top:4px">Patient-entered data — verify clinically. This page sends nothing to any server: the data is carried inside the code itself.</div></div>';
    app.innerHTML = h;
    document.title = 'بطاقة طوارئ · ' + (d.name || 'أثَر');
  }

  var frag = location.hash.replace(/^#/, '');
  var dot = frag.indexOf('.');
  if (!frag || dot < 0) return fail('لا توجد بطاقة في هذا الرابط', 'امسح رمز الطوارئ من تطبيق «أثَر» في جوال المريض.');
  if (frag.slice(0, dot) !== '1') return fail('نسخة رمز غير مدعومة', 'حدّث تطبيق «أثَر»، أو اتصل بالإسعاف.');
  if (typeof DecompressionStream === 'undefined') return fail('المتصفح قديم ولا يفتح البطاقة', 'افتح الرابط في متصفح حديث (Chrome أو Safari)، أو اتصل بالإسعاف.');
  try {
    inflate(b64urlToBytes(frag.slice(dot + 1))).then(function (txt) {
      var a = JSON.parse(txt);
      if (!Array.isArray(a) || a[0] !== 1) throw new Error('format');
      render(a);
    }).catch(function () { fail('تعذّرت قراءة البطاقة', 'الرمز تالف أو منقوص. أعد المسح، أو اتصل بالإسعاف.'); });
  } catch (e) { fail('تعذّرت قراءة البطاقة', 'الرمز تالف أو منقوص. أعد المسح، أو اتصل بالإسعاف.'); }
})();
</script>
</body>
</html>
